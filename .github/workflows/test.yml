name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Manifest sanity
        run: |
          node -e "
          const p = require('./package.json');
          if (!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch');
          if (!p.files.includes('cordis.patch.yml')) throw new Error('cordis.patch.yml not shipped');
          console.log('manifest ok', p.name, p.version);
          "
